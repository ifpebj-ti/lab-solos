networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - public_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  frontend:
    image: ${LABON_FRONTEND_IMAGE:-ghcr.io/ifpebj-ti/lab-solos-frontend}:${LABON_IMAGE_VERSION:?LABON_IMAGE_VERSION must be set}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - public_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  backend:
    image: ${LABON_BACKEND_IMAGE:-ghcr.io/ifpebj-ti/lab-solos-backend}:${LABON_IMAGE_VERSION:?LABON_IMAGE_VERSION must be set}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__PostgresConnection: Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__Usuario: ${EMAIL_USUARIO}
      Email__Senha: ${EMAIL_SENHA}
      Email__De: ${EMAIL_DE}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES}
      AllowedHosts: ${ALLOWED_HOSTS}
      ProductionAdmin__Name: ${PRODUCTION_ADMIN_NAME}
      ProductionAdmin__Email: ${PRODUCTION_ADMIN_EMAIL}
      ProductionAdmin__Password: ${PRODUCTION_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_network
      - public_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

  db:
    image: postgres:15
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

volumes:
  pg_data:
  caddy_data:
  caddy_config:
