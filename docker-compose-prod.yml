x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${PUBLIC_NETWORK_SUBNET:?PUBLIC_NETWORK_SUBNET must be set}

services:
  proxy:
    logging: *bounded-logging
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      public_network:
        ipv4_address: ${CADDY_PROXY_IP:?CADDY_PROXY_IP must be set}
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  frontend:
    logging: *bounded-logging
    image: ${LABON_FRONTEND_IMAGE:-ghcr.io/ifpebj-ti/lab-solos-frontend}:${LABON_IMAGE_VERSION:?LABON_IMAGE_VERSION must be set}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - public_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  backend:
    logging: *bounded-logging
    image: ${LABON_BACKEND_IMAGE:-ghcr.io/ifpebj-ti/lab-solos-backend}:${LABON_IMAGE_VERSION:?LABON_IMAGE_VERSION must be set}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__PostgresConnection: Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__Usuario: ${EMAIL_USUARIO}
      Email__Senha: ${EMAIL_SENHA}
      Email__De: ${EMAIL_DE}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      AuthenticationProtection__KeyHashSecretFile: /run/secrets/authentication-throttle-key
      AuthenticationProtection__RecoveryEncryptionKeysFile: /run/secrets/recovery-encryption-keys.json
      AuthenticationProtection__ForwardedHeaders__KnownProxies__0: ${CADDY_PROXY_IP:?CADDY_PROXY_IP must be set}
      AuthenticationProtection__ForwardedHeaders__ForwardLimit: "1"
      AllowedHosts: ${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_network
      - public_network
    volumes:
      - type: bind
        source: ${AUTHENTICATION_THROTTLE_KEY_FILE:?AUTHENTICATION_THROTTLE_KEY_FILE must be set}
        target: /run/secrets/authentication-throttle-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RECOVERY_ENCRYPTION_KEYS_FILE:?RECOVERY_ENCRYPTION_KEYS_FILE must be set}
        target: /run/secrets/recovery-encryption-keys.json
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

  db:
    logging: *bounded-logging
    image: postgres:15
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

volumes:
  pg_data:
  caddy_data:
  caddy_config:
