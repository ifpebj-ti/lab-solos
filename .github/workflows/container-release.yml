name: Container Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: Canonical SemVer without a v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      change-type: ${{ steps.release.outputs.change_type }}
      sha: ${{ steps.release.outputs.sha }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      proof-available: ${{ steps.reuse.outputs.proof_available }}
    steps:
      - name: Select the main commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            printf 'sha=%s\n' "$MERGE_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'sha=%s\n' "$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Restore the original release intent
        if: github.run_attempt != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/prior-intent .tmp/prior-proof
          intent_restored=false
          proof_restored=false

          restore_artifact() {
            local name=$1
            local destination=$2
            local artifact_id
            artifact_id="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --paginate --jq ".artifacts[] | select(.name == \"${name}\" and .expired == false) | .id" \
              | sed -n '1p')"
            if [[ -z "$artifact_id" ]]; then
              return 1
            fi
            gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > .tmp/previous-artifact.zip
            python - "$destination" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          target = Path(sys.argv[1])
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(".tmp/previous-artifact.zip") as archive:
              names = [name for name in archive.namelist() if Path(name).name in {
                  "release-intent.json", "release-proof.json"
              }]
              if len(names) != 1:
                  raise SystemExit("release state artifact is missing or ambiguous")
              archive.extract(names[0], target)
              extracted = target / names[0]
              extracted.replace(target / Path(names[0]).name)
          PY
          }

          for ((previous_attempt = RUN_ATTEMPT - 1; previous_attempt >= 1; previous_attempt--)); do
            if [[ "$intent_restored" == false ]]; then
              destination=".tmp/prior-intent-${previous_attempt}"
              if restore_artifact "release-intent-${previous_attempt}" "$destination"; then
                cp "$destination/release-intent.json" .tmp/release-intent.json
                intent_restored=true
              fi
            fi
            if [[ "$proof_restored" == false ]]; then
              destination=".tmp/prior-proof-${previous_attempt}"
              if restore_artifact "release-proof-${previous_attempt}" "$destination"; then
                if [[ -f "$destination/release-proof.json" ]]; then
                  cp "$destination/release-proof.json" .tmp/release-proof.json
                  proof_restored=true
                fi
              fi
            fi
          done

          if [[ "$intent_restored" != true ]]; then
            echo "The original release intent artifact is unavailable; refusing to recalculate the version" >&2
            exit 1
          fi

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            latest_tag=""
            if [[ "$RUN_ATTEMPT" == "1" ]]; then
              release_tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
              latest_tag="$(printf '%s\n' "$release_tags" \
                | awk '/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' \
                | sort -V | tail -n 1)"
            fi
            arguments=(
              --event pull_request
              --pr-body "$PR_BODY"
              --github-output "$GITHUB_OUTPUT"
            )
            if [[ -n "$latest_tag" ]]; then
              arguments+=(--latest-tag "$latest_tag")
            fi
          else
            arguments=(
              --event workflow_dispatch
              --version "$DISPATCH_VERSION"
              --ref "$DISPATCH_REF"
              --github-output "$GITHUB_OUTPUT"
            )
          fi
          arguments+=(
            --repository "$REPOSITORY"
            --run-id "$RUN_ID"
            --run-attempt "$RUN_ATTEMPT"
            --sha "$RELEASE_SHA"
            --intent-file .tmp/release-intent.json
          )
          python .github/scripts/resolve_container_version.py "${arguments[@]}"
          python - .tmp/release-intent.json .tmp/release-intent-object.json <<'PY'
          import json
          from pathlib import Path
          import sys

          records = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(records, list) or len(records) != 1:
              raise SystemExit("release intent must contain exactly one record")
          Path(sys.argv[2]).write_text(json.dumps(records[0]) + "\n", encoding="utf-8")
          PY

      - name: Persist the release intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-intent-${{ github.run_attempt }}
          path: .tmp/release-intent.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify the release changelog
        if: steps.release.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          changelog="$(mktemp)"
          trap 'rm -f -- "$changelog"' EXIT
          if ! git show "${RELEASE_SHA}:CHANGELOG.md" > "$changelog"; then
            printf 'Release %s (SHA %s): could not read changelog\n' "$VERSION" "$RELEASE_SHA" >&2
            exit 1
          fi
          python .github/scripts/check_release_changelog.py \
            --version "$VERSION" --sha "$RELEASE_SHA" --changelog "$changelog"

      - name: Detect already published release
        id: reuse
        if: steps.release.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          printf 'reuse=false\n' >> "$GITHUB_OUTPUT"
          if [[ -f .tmp/release-proof.json ]]; then
            printf 'proof_available=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'proof_available=false\n' >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$VERSION" --json tagName,targetCommitish,url,isDraft,isPrerelease \
            > .tmp-release.json 2> .tmp-release.err; then
            EXISTING_TAG="$(python -c 'import json; print(json.load(open(".tmp-release.json", encoding="utf-8"))["tagName"])')"
            EXISTING_TARGET="$(python -c 'import json; print(json.load(open(".tmp-release.json", encoding="utf-8"))["targetCommitish"])')"
            if [[ "$EXISTING_TAG" != "$VERSION" ]]; then
              echo "Release conflict: expected tag ${VERSION}, got ${EXISTING_TAG}" >&2
              exit 1
            fi
            if [[ "$EXISTING_TARGET" != "$RELEASE_SHA" ]]; then
              echo "Release conflict: ${VERSION} does not target ${RELEASE_SHA}" >&2
              exit 1
            fi
            EXISTING_IS_DRAFT="$(python -c 'import json; print(str(json.load(open(".tmp-release.json", encoding="utf-8"))["isDraft"]).lower())')"
            mkdir -p .tmp/existing-release
            if ! gh release download "$VERSION" --pattern release-proof.json \
              --dir .tmp/existing-release > /dev/null 2> .tmp-release-proof.err; then
              if [[ "$EXISTING_IS_DRAFT" != true || ! -f .tmp/release-proof.json ]]; then
                echo "Release ${VERSION} has no linked or retained proof manifest; it is unverifiable" >&2
                exit 1
              fi
              cp .tmp/release-proof.json .tmp/existing-release/release-proof.json
            fi
            python - .tmp/release-intent-object.json .tmp/existing-release/release-proof.json <<'PY'
          import json
          from pathlib import Path
          import sys

          intent = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          proof = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          keys = ("repository", "run_id", "event", "version", "sha", "change_type", "release")
          if any(intent.get(key) != proof.get(key) for key in keys):
              raise SystemExit("existing release proof belongs to a different workflow intent")
          PY
            cp .tmp/existing-release/release-proof.json .tmp/release-proof.json
            printf 'reuse=true\n' >> "$GITHUB_OUTPUT"
            printf 'proof_available=true\n' >> "$GITHUB_OUTPUT"
          else
            release_status=$?
            if ! grep -Eqi 'release not found|HTTP 404|Not Found' .tmp-release.err; then
              cat .tmp-release.err >&2
              exit "$release_status"
            fi
          fi

      - name: Summarize preparation
        shell: bash
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANGE_TYPE: ${{ steps.release.outputs.change_type }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          {
            echo '## Container release preparation'
            echo
            echo "- Actor: ${GITHUB_ACTOR}"
            echo "- SHA: ${RELEASE_SHA}"
            echo "- Release: ${RELEASE}"
            echo "- Version: ${VERSION:-not applicable}"
            echo "- Change type: ${CHANGE_TYPE}"
            echo "- Reuse published release: ${REUSE:-false}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist a recovered release proof
        if: steps.reuse.outputs.proof_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-proof-${{ github.run_attempt }}
          path: .tmp/release-proof.json
          if-no-files-found: error
          retention-days: 90

  finalize-release:
    needs:
      - prepare
      - promote-version
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' &&
      (needs.promote-version.result == 'success' ||
      (needs.prepare.outputs.proof-available == 'true' && needs.promote-version.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download the original release intent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-intent-${{ github.run_attempt }}
          path: .tmp/release-intent

      - name: Download the verified release proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-proof-${{ github.run_attempt }}
          path: .tmp/release-proof-artifact

      - name: Materialize release intent and proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          cp .tmp/release-proof-artifact/release-proof.json .tmp/release-proof.json
          python - .tmp/release-intent/release-intent.json .tmp/release-intent-object.json <<'PY'
          import json
          from pathlib import Path
          import sys

          records = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(records, list) or len(records) != 1:
              raise SystemExit("release intent must contain exactly one record")
          Path(sys.argv[2]).write_text(json.dumps(records[0]) + "\n", encoding="utf-8")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect channels and plan safe publication writes
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
        run: |
          set -euo pipefail
          mkdir -p .tmp/channel-observations
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          version = os.environ["VERSION"]
          sha = os.environ["RELEASE_SHA"]

          def run(arguments):
              return subprocess.run(arguments, capture_output=True, text=True, check=False)

          def missing(result):
              text = (result.stdout + result.stderr).lower()
              return result.returncode != 0 and (
                  "404" in text or "not found" in text or "manifest unknown" in text
              )

          observations = {}
          tag_ref = run(["gh", "api", f"repos/{repository}/git/ref/tags/{version}"])
          if tag_ref.returncode == 0:
              ref = json.loads(tag_ref.stdout)
              tag = {"status": "present", "ref": ref.get("ref"),
                     "object_type": ref.get("object", {}).get("type"),
                     "object_id": ref.get("object", {}).get("sha")}
              if tag["object_type"] == "tag":
                  peeled = run(["gh", "api", f"repos/{repository}/git/tags/{tag['object_id']}"])
                  if peeled.returncode == 0:
                      obj = json.loads(peeled.stdout).get("object", {})
                      tag["peeled_type"], tag["peeled_id"] = obj.get("type"), obj.get("sha")
                  else:
                      tag["status"] = "unavailable"
              observations["git"] = tag
          else:
              observations["git"] = {"status": "missing" if missing(tag_ref) else "unavailable"}

          release = run(["gh", "release", "view", version, "--json",
                         "tagName,targetCommitish,isDraft,isPrerelease,publishedAt,url"])
          release_state = "missing"
          release_metadata = {}
          if release.returncode == 0:
              release_metadata = json.loads(release.stdout)
              if release_metadata.get("isDraft") is True:
                  release_state = "draft"
                  observations["release"] = {"status": "missing"}
              else:
                  release_state = "present"
                  observations["release"] = {"status": "present", **release_metadata}
          else:
              observations["release"] = {
                  "status": "missing" if missing(release) else "unavailable"
              }

          def image_observation(component, reference):
              raw = run(["docker", "buildx", "imagetools", "inspect", "--raw", reference])
              if raw.returncode != 0:
                  return {"status": "missing" if missing(raw) else "unavailable"}
              digest = run(["docker", "buildx", "imagetools", "inspect", reference,
                            "--format", "{{.Manifest.Digest}}"])
              if digest.returncode != 0:
                  return {"status": "unavailable"}
              manifest = json.loads(raw.stdout)
              labels = {}
              for descriptor in manifest.get("manifests", []):
                  platform_digest = descriptor.get("digest")
                  result = run(["docker", "buildx", "imagetools", "inspect",
                                f"{reference.split(':')[0]}@{platform_digest}",
                                "--format", "{{json .Image.Config.Labels}}"])
                  if result.returncode != 0:
                      return {"status": "unavailable"}
                  labels[platform_digest] = json.loads(result.stdout or "{}") or {}
              return {"status": "present", "reference": reference,
                      "index_digest": digest.stdout.strip(), "manifest": manifest,
                      "labels": labels}

          for component in ("frontend", "backend"):
              image = os.environ[f"{component.upper()}_IMAGE"]
              observations[component] = image_observation(component, f"{image}:{version}")

          with Path(".tmp/channel-observations/observations.json").open("w", encoding="utf-8") as output:
              json.dump(observations, output)

          latest = {}
          for component in ("frontend", "backend"):
              image = os.environ[f"{component.upper()}_IMAGE"]
              reference = f"{image}:latest"
              digest = run(["docker", "buildx", "imagetools", "inspect", reference,
                            "--format", "{{.Manifest.Digest}}"])
              if digest.returncode == 0:
                  latest[component] = {"status": "present", "index_digest": digest.stdout.strip()}
              else:
                  latest[component] = {
                      "status": "missing" if missing(digest) else "inconclusive"
                  }

          releases = run(["gh", "release", "list", "--limit", "100", "--json",
                          "tagName,isDraft,isPrerelease"])
          if releases.returncode != 0:
              raise SystemExit("could not confirm the latest stable release version")
          semver = re.compile(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\Z")
          stable_versions = [item["tagName"] for item in json.loads(releases.stdout)
                             if item.get("isDraft") is False and item.get("isPrerelease") is False
                             and semver.fullmatch(item.get("tagName", ""))]
          latest_version = max(stable_versions,
                               key=lambda item: tuple(map(int, item.split("."))), default=None)
          Path(".tmp/channel-observations/latest.json").write_text(
              json.dumps({"latest_version": latest_version, "latest": latest,
                          "release_state": release_state,
                          "release_metadata": release_metadata}), encoding="utf-8")
          PY

          set +e
          python .github/scripts/check_release_channels.py \
            --repository "$REPOSITORY" --version "$VERSION" --sha "$RELEASE_SHA" \
            --observations .tmp/channel-observations/observations.json \
            --proof .tmp/release-proof.json > .tmp/channel-observations/channel-report.json
          channel_status=$?
          set -e
          if (( channel_status > 2 )) || [[ ! -s .tmp/channel-observations/channel-report.json ]]; then
            echo "Channel observation could not be interpreted" >&2
            exit 1
          fi

          python - .tmp/release-intent-object.json \
            .tmp/channel-observations/channel-report.json \
            .tmp/channel-observations/latest.json \
            .tmp/release-proof.json .tmp/publication-plan.json <<'PY'
          import json
          from pathlib import Path
          import sys

          intent, report, latest, proof = [
              json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:5]
          ]
          observations = {
              "channels": report["channels"],
              "latest_version": latest["latest_version"],
              "latest": latest["latest"],
          }
          if latest.get("release_state") == "draft":
              release = latest.get("release_metadata", {})
              if release.get("isDraft") is True \
                  and release.get("tagName") == intent["version"] \
                  and release.get("targetCommitish") == intent["sha"]:
                  observations["channels"]["release"]["status"] = "draft"
              else:
                  observations["channels"]["release"]["status"] = "conflict"
          Path(".tmp/channel-observations/planner-input.json").write_text(
              json.dumps({"intent": intent, "observations": observations, "proof": proof}),
              encoding="utf-8")
          PY
          python .github/scripts/release_publication_sequence.py \
            --input .tmp/channel-observations/planner-input.json \
            --output .tmp/publication-plan.json
          python - .tmp/publication-plan.json "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if plan["mode"] == "stop":
              raise SystemExit(plan["reason"])
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key in ("mode", "release_action", "latest_action"):
                  output.write(f"{key}={plan[key]}\n")
              for component in ("frontend", "backend"):
                  output.write(f"promote_{component}={str(component in plan['promote_latest']).lower()}\n")
          with open(sys.argv[3], "a", encoding="utf-8") as summary:
              summary.write("## Release channel plan\n\n")
              summary.write(f"- Mode: {plan['mode']}\n- Reason: {plan['reason']}\n")
              summary.write(f"- Recover only: {', '.join(plan['recover_channels']) or 'none'}\n")
              summary.write(f"- Latest: {plan['latest_action']}\n")
          PY

      - name: Recover only proven missing version channels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
          RELEASE_ACTION: ${{ steps.plan.outputs.release_action }}
        run: |
          set -euo pipefail
          python - .tmp/publication-plan.json <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          missing = set(plan["recover_channels"])
          proof = json.loads(Path(".tmp/release-proof.json").read_text(encoding="utf-8"))
          version = proof["version"]
          repository = proof["repository"]
          sha = proof["sha"]

          if "git" in missing:
              existing = subprocess.run([
                  "gh", "api", f"repos/{repository}/git/ref/tags/{version}"
              ], capture_output=True, text=True, check=False)
              existing_text = (existing.stdout + existing.stderr).lower()
              if existing.returncode == 0 or not ("404" in existing_text or "not found" in existing_text):
                  raise SystemExit("Git tag changed after planning; refusing to overwrite or guess")
              result = subprocess.run([
                  "gh", "api", "--method", "POST", f"repos/{repository}/git/refs",
                  "-f", f"ref=refs/tags/{version}", "-f", f"sha={sha}"
              ], capture_output=True, text=True, check=False)
              if result.returncode:
                  raise SystemExit("could not create the missing Git tag from the release proof")

          for component in ("frontend", "backend"):
              if component not in missing:
                  continue
              image = os.environ[f"{component.upper()}_IMAGE"]
              reference = f"{image}:{version}"
              existing = subprocess.run([
                  "docker", "buildx", "imagetools", "inspect", "--raw", reference
              ], capture_output=True, text=True, check=False)
              existing_text = (existing.stdout + existing.stderr).lower()
              if existing.returncode == 0 or not (
                  "manifest unknown" in existing_text or "404" in existing_text
                  or "not found" in existing_text
              ):
                  raise SystemExit(f"{component} version tag changed after planning; refusing to overwrite")
              digests = proof["images"][component]["platforms"]
              result = subprocess.run([
                  "docker", "buildx", "imagetools", "create", "--tag",
                  f"{image}:{version}",
                  f"{image}@{digests['linux/amd64']}",
                  f"{image}@{digests['linux/arm64']}",
              ], capture_output=True, text=True, check=False)
              if result.returncode:
                  raise SystemExit(f"could not recover the missing {component} version tag")
          PY

          if [[ "$RELEASE_ACTION" == "create-draft" ]]; then
            if gh release view "$VERSION" --json tagName,targetCommitish,isDraft \
              > .tmp/release-before-create.json 2> .tmp/release-before-create.err; then
              echo "Release changed after planning; refusing to overwrite its state" >&2
              exit 1
            else
              status=$?
              if ! grep -Eqi 'release not found|HTTP 404|Not Found' .tmp/release-before-create.err; then
                cat .tmp/release-before-create.err >&2
                exit "$status"
              fi
            fi
            gh release create "$VERSION" .tmp/release-proof.json \
              --target "$RELEASE_SHA" --title "$VERSION" --draft --generate-notes
          elif [[ "$RELEASE_ACTION" == "publish-draft" ]]; then
            gh release view "$VERSION" --json tagName,targetCommitish,isDraft \
              > .tmp/draft-before-upload.json
            python - .tmp/draft-before-upload.json "$VERSION" "$RELEASE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (release.get("tagName") != sys.argv[2]
                  or release.get("targetCommitish") != sys.argv[3]
                  or release.get("isDraft") is not True):
              raise SystemExit("release draft changed after planning")
          PY
            mkdir -p .tmp/draft-proof
            if gh release download "$VERSION" --pattern release-proof.json \
              --dir .tmp/draft-proof > /dev/null 2> .tmp/draft-proof-download.err; then
              if ! cmp -s .tmp/release-proof.json .tmp/draft-proof/release-proof.json; then
                echo "Existing release draft proof differs from the verified proof" >&2
                exit 1
              fi
            else
              if ! grep -Eqi 'not found|404' .tmp/draft-proof-download.err; then
                cat .tmp/draft-proof-download.err >&2
                exit 1
              fi
              gh release upload "$VERSION" .tmp/release-proof.json
            fi
          fi

      - name: Plan and execute the verified sequence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          LATEST_ACTION: ${{ steps.plan.outputs.latest_action }}
          PROMOTE_FRONTEND: ${{ steps.plan.outputs.promote_frontend }}
          PROMOTE_BACKEND: ${{ steps.plan.outputs.promote_backend }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/manifests

          FRONTEND_VERSION="${FRONTEND_IMAGE}:${VERSION}"
          BACKEND_VERSION="${BACKEND_IMAGE}:${VERSION}"
          FRONTEND_LATEST="${FRONTEND_IMAGE}:latest"
          BACKEND_LATEST="${BACKEND_IMAGE}:latest"

          registry_digest() {
            local reference=$1
            local digest
            digest="$(docker buildx imagetools inspect "$reference" --format '{{.Manifest.Digest}}')"
            digest="$(printf '%s' "$digest" | tr -d '\r\n')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid registry digest for ${reference}" >&2
              return 1
            fi
            printf '%s' "$digest"
          }

          verify_registry_digest() {
            local reference=$1
            local expected=$2
            local actual
            actual="$(registry_digest "$reference")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Digest mismatch for ${reference}: expected ${expected}, got ${actual}" >&2
              return 1
            fi
          }

          docker buildx imagetools inspect --raw "$FRONTEND_VERSION" \
            > .tmp/manifests/frontend-version.json
          python .github/scripts/validate_container_manifest.py \
            .tmp/manifests/frontend-version.json
          FRONTEND_VERSION_DIGEST="$(registry_digest "$FRONTEND_VERSION")"

          docker buildx imagetools inspect --raw "$BACKEND_VERSION" \
            > .tmp/manifests/backend-version.json
          python .github/scripts/validate_container_manifest.py \
            .tmp/manifests/backend-version.json
          BACKEND_VERSION_DIGEST="$(registry_digest "$BACKEND_VERSION")"

          verify_release_revision() {
            local image=$1
            local manifest_path=$2
            local platform
            local digest
            local labels
            local revision

            while IFS=$'\t' read -r platform digest; do
              labels="$(docker buildx imagetools inspect "${image}@${digest}" \
                --format '{{json .Image.Config.Labels}}')"
              revision="$(printf '%s' "$labels" | python -c \
                'import json, sys; labels = json.load(sys.stdin) or {}; print(labels.get("org.opencontainers.image.revision", ""))')"
              if [[ "$revision" != "$RELEASE_SHA" ]]; then
                echo "Revision mismatch for ${image} ${platform}: expected ${RELEASE_SHA}, got ${revision:-missing}" >&2
                return 1
              fi
            done < <(python - "$manifest_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for descriptor in manifest["manifests"]:
              platform = descriptor["platform"]
              print(f'{platform["os"]}/{platform["architecture"]}\t{descriptor["digest"]}')
          PY
            )
          }

          verify_release_revision "${FRONTEND_IMAGE}" .tmp/manifests/frontend-version.json
          verify_release_revision "${BACKEND_IMAGE}" .tmp/manifests/backend-version.json

          capture_latest() {
            local reference=$1
            local component=$2
            local digest
            local inspect_status
            if docker buildx imagetools inspect --raw "$reference" \
              > ".tmp/manifests/${component}-latest-before.json" 2> ".tmp/manifests/${component}-latest-inspect.err"; then
              digest="$(registry_digest "$reference")"
            else
              inspect_status=$?
              if grep -Eqi 'manifest unknown|unexpected status.*404|: not found$' \
                ".tmp/manifests/${component}-latest-inspect.err"; then
                : > ".tmp/manifests/${component}-latest-before.json"
                digest=""
              else
                cat ".tmp/manifests/${component}-latest-inspect.err" >&2
                return "$inspect_status"
              fi
            fi
            case "$component" in
              frontend) FRONTEND_PREVIOUS_DIGEST=$digest ;;
              backend) BACKEND_PREVIOUS_DIGEST=$digest ;;
              *) echo "Unsupported component: ${component}" >&2; return 1 ;;
            esac
          }

          capture_latest "$FRONTEND_LATEST" frontend
          capture_latest "$BACKEND_LATEST" backend

          STABLE_LATEST_VERSION="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            | python -c 'import json, re, sys; releases=json.load(sys.stdin); semver=re.compile(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\Z"); versions=[r["tagName"] for r in releases if r.get("isDraft") is False and r.get("isPrerelease") is False and semver.fullmatch(r.get("tagName", ""))]; print(max(versions, key=lambda value: tuple(map(int, value.split("."))), default=""))')"
          LATEST_GUARD="$(python - "$STABLE_LATEST_VERSION" "$VERSION" <<'PY'
          import sys

          latest, target = sys.argv[1:]
          key = lambda version: tuple(map(int, version.split("."))) if version else None
          if key(latest) is not None and key(latest) > key(target):
              print("newer")
          elif latest == target:
              print("same")
          else:
              print("older")
          PY
          )"
          if [[ "$LATEST_GUARD" == newer ]]; then
            if [[ -z "$FRONTEND_PREVIOUS_DIGEST" || -z "$BACKEND_PREVIOUS_DIGEST" ]]; then
              echo "A newer stable release appeared after planning but both latest tags are not present" >&2
              exit 1
            fi
            LATEST_ACTION=preserve-newer
            PROMOTE_FRONTEND=false
            PROMOTE_BACKEND=false
            echo "A newer stable release appeared after planning; preserving both latest tags"
          elif [[ "$LATEST_GUARD" == same ]]; then
            if [[ ! -s .tmp/manifests/frontend-latest-before.json || \
                  ! -s .tmp/manifests/backend-latest-before.json ]] || \
              ! python .github/scripts/validate_container_manifest.py \
                .tmp/manifests/frontend-latest-before.json --compare .tmp/manifests/frontend-version.json || \
              ! python .github/scripts/validate_container_manifest.py \
                .tmp/manifests/backend-latest-before.json --compare .tmp/manifests/backend-version.json; then
              echo "Stable version and latest tags changed after planning; refusing to overwrite" >&2
              exit 1
            fi
          fi

          FRONTEND_STATE=needs-promotion
          BACKEND_STATE=needs-promotion
          if [[ "$LATEST_ACTION" == "preserve-newer" ]]; then
            FRONTEND_STATE=preserved-newer
            BACKEND_STATE=preserved-newer
          elif python .github/scripts/validate_container_manifest.py \
            .tmp/manifests/frontend-latest-before.json \
            --compare .tmp/manifests/frontend-version.json; then
            FRONTEND_STATE=existing-identical
          fi
          if [[ "$LATEST_ACTION" != "preserve-newer" ]] && python .github/scripts/validate_container_manifest.py \
            .tmp/manifests/backend-latest-before.json \
            --compare .tmp/manifests/backend-version.json; then
            BACKEND_STATE=existing-identical
          fi

          FRONTEND_WRITTEN=false
          BACKEND_WRITTEN=false

          rollback_latest() {
            local failure_status=$?
            local rollback_failed=0
            trap - ERR
            set +e

            if [[ "$BACKEND_WRITTEN" == true ]]; then
              if [[ -z "$BACKEND_PREVIOUS_DIGEST" ]]; then
                echo "Cannot restore ${BACKEND_LATEST}; no previous tag existed" >&2
                rollback_failed=1
              elif ! docker buildx imagetools create --prefer-index=false --tag "$BACKEND_LATEST" \
                "${BACKEND_IMAGE}@${BACKEND_PREVIOUS_DIGEST}"; then
                echo "Failed to restore ${BACKEND_LATEST}" >&2
                rollback_failed=1
              elif ! docker buildx imagetools inspect --raw "$BACKEND_LATEST" \
                > .tmp/manifests/backend-latest-restored.json; then
                echo "Failed to inspect restored ${BACKEND_LATEST}" >&2
                rollback_failed=1
              elif ! verify_registry_digest "$BACKEND_LATEST" "$BACKEND_PREVIOUS_DIGEST"; then
                echo "Restored ${BACKEND_LATEST} does not match its captured state" >&2
                rollback_failed=1
              fi
            fi

            if [[ "$FRONTEND_WRITTEN" == true ]]; then
              if [[ -z "$FRONTEND_PREVIOUS_DIGEST" ]]; then
                echo "Cannot restore ${FRONTEND_LATEST}; no previous tag existed" >&2
                rollback_failed=1
              elif ! docker buildx imagetools create --prefer-index=false --tag "$FRONTEND_LATEST" \
                "${FRONTEND_IMAGE}@${FRONTEND_PREVIOUS_DIGEST}"; then
                echo "Failed to restore ${FRONTEND_LATEST}" >&2
                rollback_failed=1
              elif ! docker buildx imagetools inspect --raw "$FRONTEND_LATEST" \
                > .tmp/manifests/frontend-latest-restored.json; then
                echo "Failed to inspect restored ${FRONTEND_LATEST}" >&2
                rollback_failed=1
              elif ! verify_registry_digest "$FRONTEND_LATEST" "$FRONTEND_PREVIOUS_DIGEST"; then
                echo "Restored ${FRONTEND_LATEST} does not match its captured state" >&2
                rollback_failed=1
              fi
            fi

            {
              echo '## Latest rollback'
              echo
              echo "- Frontend previous digest: ${FRONTEND_PREVIOUS_DIGEST}"
              echo "- Backend previous digest: ${BACKEND_PREVIOUS_DIGEST}"
              echo "- Manual intervention required: $([[ $rollback_failed == 0 ]] && echo no || echo yes)"
            } >> "$GITHUB_STEP_SUMMARY"

            if (( rollback_failed != 0 )); then
              echo "::error::Rollback compensation failed; manual intervention is required" >&2
              exit 2
            fi
            echo "::error::Latest promotion failed; captured state was restored" >&2
            exit "$failure_status"
          }

          trap rollback_latest ERR

          if [[ "$FRONTEND_STATE" == needs-promotion && "$PROMOTE_FRONTEND" == true ]]; then
            FRONTEND_WRITTEN=true
            docker buildx imagetools create --tag "$FRONTEND_LATEST" \
              "${FRONTEND_IMAGE}@${FRONTEND_VERSION_DIGEST}"
            docker buildx imagetools inspect --raw "$FRONTEND_LATEST" \
              > .tmp/manifests/frontend-latest.json
            python .github/scripts/validate_container_manifest.py .tmp/manifests/frontend-latest.json --compare .tmp/manifests/frontend-version.json
          elif [[ "$FRONTEND_STATE" != preserved-newer && -s ".tmp/manifests/frontend-latest-before.json" ]]; then
            cp .tmp/manifests/frontend-latest-before.json .tmp/manifests/frontend-latest.json
          fi

          if [[ "$BACKEND_STATE" == needs-promotion && "$PROMOTE_BACKEND" == true ]]; then
            BACKEND_WRITTEN=true
            docker buildx imagetools create --tag "$BACKEND_LATEST" \
              "${BACKEND_IMAGE}@${BACKEND_VERSION_DIGEST}"
            docker buildx imagetools inspect --raw "$BACKEND_LATEST" \
              > .tmp/manifests/backend-latest.json
            python .github/scripts/validate_container_manifest.py .tmp/manifests/backend-latest.json --compare .tmp/manifests/backend-version.json
          elif [[ "$BACKEND_STATE" != preserved-newer && -s ".tmp/manifests/backend-latest-before.json" ]]; then
            cp .tmp/manifests/backend-latest-before.json .tmp/manifests/backend-latest.json
          fi

          FRONTEND_LATEST_DIGEST="$(registry_digest "$FRONTEND_LATEST")"
          BACKEND_LATEST_DIGEST="$(registry_digest "$BACKEND_LATEST")"
          trap - ERR

          {
            echo '## Container release completed'
            echo
            echo "- Actor: ${GITHUB_ACTOR}"
            echo "- SHA: ${RELEASE_SHA}"
            echo "- Version: ${VERSION}"
            echo "- Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '| Component | Version digest | Latest digest | Previous latest digest |'
            echo '|---|---|---|---|'
            echo "| frontend | ${FRONTEND_VERSION_DIGEST} | ${FRONTEND_LATEST_DIGEST} | ${FRONTEND_PREVIOUS_DIGEST} |"
            echo "| backend | ${BACKEND_VERSION_DIGEST} | ${BACKEND_LATEST_DIGEST} | ${BACKEND_PREVIOUS_DIGEST} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release draft and version channels before stable publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
        run: |
          set -euo pipefail
          mkdir -p .tmp/channel-observations
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def query(arguments):
              return subprocess.run(arguments, capture_output=True, text=True, check=False)

          repository = os.environ["REPOSITORY"]
          version = os.environ["VERSION"]
          sha = os.environ["RELEASE_SHA"]
          observations = {}

          tag = query(["gh", "api", f"repos/{repository}/git/ref/tags/{version}"])
          if tag.returncode != 0:
              raise SystemExit("could not read back the Git tag before stable publication")
          ref = json.loads(tag.stdout)
          git = {"status": "present", "ref": ref.get("ref"),
                 "object_type": ref.get("object", {}).get("type"),
                 "object_id": ref.get("object", {}).get("sha")}
          if git["object_type"] == "tag":
              peeled = query(["gh", "api", f"repos/{repository}/git/tags/{git['object_id']}"])
              if peeled.returncode != 0:
                  raise SystemExit("could not peel the Git tag before stable publication")
              obj = json.loads(peeled.stdout).get("object", {})
              git["peeled_type"], git["peeled_id"] = obj.get("type"), obj.get("sha")
          observations["git"] = git

          release_result = query(["gh", "release", "view", version, "--json",
                                  "tagName,targetCommitish,url,isDraft,isPrerelease,publishedAt"])
          if release_result.returncode != 0:
              raise SystemExit("release draft disappeared before stable publication")
          release = json.loads(release_result.stdout)
          if (release.get("tagName") != version
                  or release.get("targetCommitish") != sha
                  or release.get("isPrerelease") is True):
              raise SystemExit("release identity conflicts with the verified intent")
          release_state = "draft" if release.get("isDraft") is True else "stable"
          if release_state == "draft":
              observations["release"] = {"status": "missing"}
          else:
              observations["release"] = {"status": "present", **release}

          for component in ("frontend", "backend"):
              image = os.environ[f"{component.upper()}_IMAGE"]
              reference = f"{image}:{version}"
              raw = query(["docker", "buildx", "imagetools", "inspect", "--raw", reference])
              digest = query(["docker", "buildx", "imagetools", "inspect", reference,
                              "--format", "{{.Manifest.Digest}}"])
              if raw.returncode != 0 or digest.returncode != 0:
                  observations[component] = {"status": "unavailable"}
                  continue
              manifest = json.loads(raw.stdout)
              labels = {}
              for descriptor in manifest.get("manifests", []):
                  platform_digest = descriptor.get("digest")
                  result = query(["docker", "buildx", "imagetools", "inspect",
                                  f"{image}@{platform_digest}",
                                  "--format", "{{json .Image.Config.Labels}}"])
                  if result.returncode != 0:
                      labels = None
                      break
                  labels[platform_digest] = json.loads(result.stdout or "{}") or {}
              if labels is None:
                  observations[component] = {"status": "unavailable"}
              else:
                  observations[component] = {
                      "status": "present", "reference": reference,
                      "index_digest": digest.stdout.strip(),
                      "manifest": manifest, "labels": labels,
                  }

          Path(".tmp/channel-observations/pre-publish.json").write_text(
              json.dumps({"release_state": release_state, "channels": observations}),
              encoding="utf-8")
          Path(".tmp/channel-observations/pre-publish-observations.json").write_text(
              json.dumps(observations), encoding="utf-8")
          PY

          set +e
          python .github/scripts/check_release_channels.py \
            --repository "$REPOSITORY" --version "$VERSION" --sha "$RELEASE_SHA" \
            --observations .tmp/channel-observations/pre-publish-observations.json \
            --proof .tmp/release-proof.json > .tmp/channel-observations/pre-publish-report.json
          verification_status=$?
          set -e
          python - .tmp/channel-observations/pre-publish.json \
            .tmp/channel-observations/pre-publish-report.json \
            "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          state = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_release = "missing" if state["release_state"] == "draft" else "consistent"
          for name in ("git", "frontend", "backend"):
              if report["channels"][name]["status"] != "consistent":
                  raise SystemExit(f"{name} channel failed pre-publication verification")
          if report["channels"]["release"]["status"] != expected_release:
              raise SystemExit("release state changed during pre-publication verification")
          with open(sys.argv[3], "a", encoding="utf-8") as summary:
              summary.write("\n## Pre-publication channel verification\n\n")
              summary.write(f"- Git tag: {report['channels']['git']['status']}\n")
              summary.write(f"- Release: {state['release_state']} (intent identity matched)\n")
              summary.write(f"- Frontend: {report['channels']['frontend']['status']}\n")
              summary.write(f"- Backend: {report['channels']['backend']['status']}\n")
          PY
          if [[ "$verification_status" -gt 1 ]]; then
            echo "Pre-publication channel verification was inconclusive" >&2
            exit 1
          fi

          if python - .tmp/channel-observations/pre-publish.json <<'PY'
          import json
          from pathlib import Path
          import sys
          raise SystemExit(0 if json.loads(Path(sys.argv[1]).read_text())["release_state"] == "draft" else 1)
          PY
          then
            RELEASE_ID="$(gh api "repos/${REPOSITORY}/releases/tags/${VERSION}" --jq '.id')"
            gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false > .tmp/release-published.json
            RELEASE_URL="$(python -c 'import json; print(json.load(open(".tmp/release-published.json", encoding="utf-8"))["html_url"])')"
            RELEASE_STATE=published
          else
            RELEASE_URL="$(python -c 'import json; print(json.load(open(".tmp/channel-observations/pre-publish.json", encoding="utf-8"))["channels"]["release"]["url"])')"
            RELEASE_STATE=already-stable
          fi
          {
            echo '## Stable release published after channel verification'
            echo
            echo "- Version: ${VERSION}"
            echo "- SHA: ${RELEASE_SHA}"
            echo "- State: ${RELEASE_STATE}"
            echo "- Release: ${RELEASE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all four release channels after publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def query(arguments):
              return subprocess.run(arguments, capture_output=True, text=True, check=False)

          repository, version = os.environ["REPOSITORY"], os.environ["VERSION"]
          observations = json.loads(Path(".tmp/channel-observations/observations.json")
                                    .read_text(encoding="utf-8"))
          ref_result = query(["gh", "api", f"repos/{repository}/git/ref/tags/{version}"])
          if ref_result.returncode == 0:
              ref = json.loads(ref_result.stdout)
              tag = {"status": "present", "ref": ref.get("ref"),
                     "object_type": ref.get("object", {}).get("type"),
                     "object_id": ref.get("object", {}).get("sha")}
              if tag["object_type"] == "tag":
                  peeled = query(["gh", "api", f"repos/{repository}/git/tags/{tag['object_id']}"])
                  if peeled.returncode == 0:
                      obj = json.loads(peeled.stdout).get("object", {})
                      tag["peeled_type"], tag["peeled_id"] = obj.get("type"), obj.get("sha")
                  else:
                      tag["status"] = "unavailable"
              observations["git"] = tag
          else:
              text = (ref_result.stdout + ref_result.stderr).lower()
              observations["git"] = {"status": "missing" if "404" in text or "not found" in text else "unavailable"}

          release = query(["gh", "release", "view", version, "--json",
                           "tagName,isDraft,isPrerelease,publishedAt,url"])
          if release.returncode == 0:
              observations["release"] = {"status": "present", **json.loads(release.stdout)}
          else:
              text = (release.stdout + release.stderr).lower()
              observations["release"] = {"status": "missing" if "404" in text or "not found" in text else "unavailable"}

          Path(".tmp/channel-observations/final-observations.json").write_text(
              json.dumps(observations), encoding="utf-8")
          PY

          set +e
          python .github/scripts/check_release_channels.py \
            --repository "$REPOSITORY" --version "$VERSION" --sha "$RELEASE_SHA" \
            --observations .tmp/channel-observations/final-observations.json \
            --proof .tmp/release-proof.json > .tmp/channel-observations/final-report.json
          verification_status=$?
          set -e
          python - .tmp/channel-observations/final-report.json \
            .tmp/release-proof.json "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          proof = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          with open(sys.argv[3], "a", encoding="utf-8") as summary:
              summary.write("\n## Verified release channels\n\n")
              summary.write(f"- Intent run: {proof['run_id']} / attempt {proof.get('run_attempt', 1)}\n")
              summary.write(f"- Current run attempt: {__import__('os').environ.get('GITHUB_RUN_ATTEMPT', '')}\n")
              for name, channel in report["channels"].items():
                  summary.write(f"- {name}: {channel['status']} ({channel['reason']})\n")
          PY
          if (( verification_status != 0 )); then
            echo "Release channel verification failed or was inconclusive; see the per-channel report above" >&2
            exit 1
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.reuse != 'true' && needs.prepare.outputs.proof-available != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/ifpebj-ti/lab-solos-frontend
            platform: linux/amd64
            arch: amd64
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/ifpebj-ti/lab-solos-frontend
            platform: linux/arm64
            arch: arm64
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/ifpebj-ti/lab-solos-backend
            platform: linux/amd64
            arch: amd64
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/ifpebj-ti/lab-solos-backend
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push canonical digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Persist digest
        id: digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test "$DIGEST" != ""
          mkdir -p .tmp/digests
          printf '%s\n' "$DIGEST" > ".tmp/digests/${{ matrix.component }}-${{ matrix.arch }}.txt"
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: .tmp/digests/${{ matrix.component }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: Summarize build
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "- ${{ matrix.component }} ${{ matrix.platform }}: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.reuse != 'true' && needs.prepare.outputs.proof-available != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: frontend
            image: ghcr.io/ifpebj-ti/lab-solos-frontend
            platform: linux/amd64
            arch: amd64
          - component: frontend
            image: ghcr.io/ifpebj-ti/lab-solos-frontend
            platform: linux/arm64
            arch: arm64
          - component: backend
            image: ghcr.io/ifpebj-ti/lab-solos-backend
            platform: linux/amd64
            arch: amd64
          - component: backend
            image: ghcr.io/ifpebj-ti/lab-solos-backend
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: .tmp/digest

      - name: Read immutable reference
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat ".tmp/digest/${{ matrix.component }}-${{ matrix.arch }}.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        shell: bash
        run: bash .github/scripts/install_trivy.sh .tmp/trivy-bin

      - name: Generate Trivy table
        shell: bash
        env:
          SCAN_REFERENCE: ${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: |
          mkdir -p .tmp/trivy-reports
          .tmp/trivy-bin/trivy image --config .trivy.yaml --exit-code 0 \
            --format table --output ".tmp/trivy-reports/${{ matrix.component }}-${{ matrix.arch }}.txt" \
            "$SCAN_REFERENCE"
          cat ".tmp/trivy-reports/${{ matrix.component }}-${{ matrix.arch }}.txt"

      - name: Generate Trivy SARIF
        shell: bash
        env:
          SCAN_REFERENCE: ${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: |
          .tmp/trivy-bin/trivy image --config .trivy.yaml --exit-code 0 \
            --format sarif --output ".tmp/trivy-reports/${{ matrix.component }}-${{ matrix.arch }}.sarif" \
            "$SCAN_REFERENCE"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.component }}-${{ matrix.arch }}
          path: .tmp/trivy-reports
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: .tmp/trivy-reports/${{ matrix.component }}-${{ matrix.arch }}.sarif
          category: trivy-release-${{ matrix.component }}-${{ matrix.arch }}

      - name: Enforce the blocking Trivy policy
        if: always()
        shell: bash
        env:
          SCAN_REFERENCE: ${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: |
          .tmp/trivy-bin/trivy image --config .trivy.yaml --exit-code 1 \
            --format table "$SCAN_REFERENCE"

      - name: Summarize scan
        if: always()
        shell: bash
        run: |
          echo "- ${{ matrix.component }} ${{ matrix.platform }}: scan attempted for digest ${{ steps.digest.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"

  promote-version:
    needs:
      - prepare
      - scan
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.reuse != 'true' && needs.prepare.outputs.proof-available != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download all scanned digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: .tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect version collisions before writing tags
        id: collision
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
        run: |
          set -euo pipefail
          mkdir -p .tmp/manifests

          read_digest() {
            local path=$1
            local digest
            digest="$(tr -d '\r\n' < "$path")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest in ${path}" >&2
              return 1
            fi
            printf '%s' "$digest"
          }

          FRONTEND_AMD64="$(read_digest .tmp/digests/frontend-amd64.txt)"
          FRONTEND_ARM64="$(read_digest .tmp/digests/frontend-arm64.txt)"
          BACKEND_AMD64="$(read_digest .tmp/digests/backend-amd64.txt)"
          BACKEND_ARM64="$(read_digest .tmp/digests/backend-arm64.txt)"
          FRONTEND_TAG="${FRONTEND_IMAGE}:${VERSION}"
          BACKEND_TAG="${BACKEND_IMAGE}:${VERSION}"

          python - "$FRONTEND_AMD64" "$FRONTEND_ARM64" "$BACKEND_AMD64" "$BACKEND_ARM64" <<'PY'
          import json
          from pathlib import Path
          import sys

          media_type = "application/vnd.oci.image.manifest.v1+json"
          index_media_type = "application/vnd.oci.image.index.v1+json"

          def candidate(amd64_digest, arm64_digest):
              return {
                  "schemaVersion": 2,
                  "mediaType": index_media_type,
                  "manifests": [
                      {
                          "mediaType": media_type,
                          "digest": amd64_digest,
                          "platform": {"os": "linux", "architecture": "amd64"},
                      },
                      {
                          "mediaType": media_type,
                          "digest": arm64_digest,
                          "platform": {"os": "linux", "architecture": "arm64"},
                      },
                  ],
              }

          output = Path(".tmp/manifests")
          pairs = {
              "frontend": (sys.argv[1], sys.argv[2]),
              "backend": (sys.argv[3], sys.argv[4]),
          }
          for component, digests in pairs.items():
              path = output / f"{component}-candidate.json"
              path.write_text(json.dumps(candidate(*digests)), encoding="utf-8")
          PY

          python .github/scripts/validate_container_manifest.py .tmp/manifests/frontend-candidate.json
          python .github/scripts/validate_container_manifest.py .tmp/manifests/backend-candidate.json

          check_version_tag() {
            local tag=$1
            local candidate=$2
            local existing=$3
            local error_log=$4
            local state_variable=$5
            local inspect_status

            if docker buildx imagetools inspect --raw "$tag" > "$existing" 2> "$error_log"; then
              python .github/scripts/validate_container_manifest.py "$existing" --compare "$candidate"
              printf -v "$state_variable" '%s' existing-identical
            else
              inspect_status=$?
              if grep -Eqi 'manifest unknown|unexpected status.*404|: not found$' "$error_log"; then
                printf -v "$state_variable" '%s' absent
              else
                cat "$error_log" >&2
                return "$inspect_status"
              fi
            fi
          }

          check_version_tag "$FRONTEND_TAG" \
            .tmp/manifests/frontend-candidate.json \
            .tmp/manifests/frontend-existing.json \
            .tmp/manifests/frontend-inspect.err FRONTEND_STATE
          check_version_tag "$BACKEND_TAG" \
            .tmp/manifests/backend-candidate.json \
            .tmp/manifests/backend-existing.json \
            .tmp/manifests/backend-inspect.err BACKEND_STATE

          printf 'tag_state_frontend=%s\n' "$FRONTEND_STATE" >> "$GITHUB_OUTPUT"
          printf 'tag_state_backend=%s\n' "$BACKEND_STATE" >> "$GITHUB_OUTPUT"
          {
            echo "- tag-state-frontend: ${FRONTEND_STATE}"
            echo "- tag-state-backend: ${BACKEND_STATE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create missing version tags
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
          FRONTEND_STATE: ${{ steps.collision.outputs.tag_state_frontend }}
          BACKEND_STATE: ${{ steps.collision.outputs.tag_state_backend }}
        run: |
          set -euo pipefail
          FRONTEND_AMD64="$(tr -d '\r\n' < .tmp/digests/frontend-amd64.txt)"
          FRONTEND_ARM64="$(tr -d '\r\n' < .tmp/digests/frontend-arm64.txt)"
          BACKEND_AMD64="$(tr -d '\r\n' < .tmp/digests/backend-amd64.txt)"
          BACKEND_ARM64="$(tr -d '\r\n' < .tmp/digests/backend-arm64.txt)"
          FRONTEND_TAG="${FRONTEND_IMAGE}:${VERSION}"
          BACKEND_TAG="${BACKEND_IMAGE}:${VERSION}"

          case "$FRONTEND_STATE" in
            absent)
              docker buildx imagetools create --tag "$FRONTEND_TAG" \
                "${FRONTEND_IMAGE}@${FRONTEND_AMD64}" \
                "${FRONTEND_IMAGE}@${FRONTEND_ARM64}"
              ;;
            existing-identical) ;;
            *) echo "Unexpected frontend tag state" >&2; exit 1 ;;
          esac
          case "$BACKEND_STATE" in
            absent)
              docker buildx imagetools create --tag "$BACKEND_TAG" \
                "${BACKEND_IMAGE}@${BACKEND_AMD64}" \
                "${BACKEND_IMAGE}@${BACKEND_ARM64}"
              ;;
            existing-identical) ;;
            *) echo "Unexpected backend tag state" >&2; exit 1 ;;
          esac

      - name: Verify both version manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
        run: |
          set -euo pipefail
          FRONTEND_TAG="${FRONTEND_IMAGE}:${VERSION}"
          BACKEND_TAG="${BACKEND_IMAGE}:${VERSION}"
          docker buildx imagetools inspect --raw "$FRONTEND_TAG" \
            > .tmp/manifests/frontend-version.json
          python .github/scripts/validate_container_manifest.py .tmp/manifests/frontend-version.json --compare .tmp/manifests/frontend-candidate.json
          docker buildx imagetools inspect --raw "$BACKEND_TAG" \
            > .tmp/manifests/backend-version.json
          python .github/scripts/validate_container_manifest.py .tmp/manifests/backend-version.json --compare .tmp/manifests/backend-candidate.json
          {
            echo "## Verified version manifests"
            echo
            echo "- Frontend: ${FRONTEND_TAG}"
            echo "- Backend: ${BACKEND_TAG}"
            echo "- Revision: ${{ needs.prepare.outputs.sha }}"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the original release intent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-intent-${{ github.run_attempt }}
          path: .tmp/release-intent

      - name: Build the immutable release proof
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-frontend
          BACKEND_IMAGE: ghcr.io/ifpebj-ti/lab-solos-backend
        run: |
          set -euo pipefail
          mkdir -p .tmp
          FRONTEND_INDEX_DIGEST="$(docker buildx imagetools inspect \
            "${FRONTEND_IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          BACKEND_INDEX_DIGEST="$(docker buildx imagetools inspect \
            "${BACKEND_IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          export FRONTEND_INDEX_DIGEST BACKEND_INDEX_DIGEST
          python - .tmp/release-intent/release-intent.json .tmp/release-proof.json <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          records = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(records, list) or len(records) != 1:
              raise SystemExit("release intent must contain exactly one record")
          proof = dict(records[0])
          images = {}
          for component in ("frontend", "backend"):
              manifest = json.loads(Path(f".tmp/manifests/{component}-version.json")
                                    .read_text(encoding="utf-8"))
              platforms = {
                  f"{item['platform']['os']}/{item['platform']['architecture']}": item["digest"]
                  for item in manifest.get("manifests", [])
              }
              if set(platforms) != {"linux/amd64", "linux/arm64"}:
                  raise SystemExit(f"{component} proof does not contain the exact platform set")
              images[component] = {
                  "index_digest": os.environ[f"{component.upper()}_INDEX_DIGEST"].strip(),
                  "platforms": platforms,
              }
          proof["images"] = images
          proof["run_attempt"] = int(os.environ["GITHUB_RUN_ATTEMPT"])
          Path(sys.argv[2]).write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Persist the release proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-proof-${{ github.run_attempt }}
          path: .tmp/release-proof.json
          if-no-files-found: error
          retention-days: 90
