name: Container CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --run --coverage

      - name: Collect frontend coverage report
        if: always()
        working-directory: ${{ github.workspace }}
        run: >-
          python -B .github/scripts/collect_frontend_coverage.py
          --summary ".tmp/coverage/frontend/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/coverage-summary.json"
          --output .tmp/coverage/frontend.json
          --repository-root "$GITHUB_WORKSPACE"
          --sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload normalized frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: .tmp/coverage/frontend.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run design validator tests
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/tests -p 'test_check_design_coverage.py' -v

      - name: Validate design coverage inventory
        working-directory: ${{ github.workspace }}
        run: python scripts/check_design_coverage.py --spec .codex/docs/specs/reformulacao-design --final

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.428"

      - name: Restore backend solution
        run: dotnet restore backend/backend.sln --locked-mode

      - name: Build backend solution
        run: dotnet build backend/backend.sln --no-restore -c Release --nologo --disable-build-servers

      - name: Verify Docker for PostgreSQL integration tests
        run: docker info

      - name: Test PostgreSQL integration and credential migrations
        run: >-
          dotnet test backend/Tests/Tests.csproj --no-build --no-restore -c Release --nologo --disable-build-servers
          --filter "FullyQualifiedName~Integration|FullyQualifiedName~CredentialLifecycleMigrationTests"

      - name: Test backend solution
        run: >-
          dotnet test backend/backend.sln --no-build --no-restore -c Release
          --nologo --disable-build-servers --collect:"XPlat Code Coverage"
          --results-directory ".tmp/coverage/backend/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"

      - name: Collect backend coverage report
        if: always()
        shell: bash
        run: |
          results_directory=".tmp/coverage/backend/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mapfile -t coverage_reports < <(
            find "$results_directory" -mindepth 2 -maxdepth 2 -type f \
              -name coverage.cobertura.xml -print 2>/dev/null
          )
          if [[ ${#coverage_reports[@]} -ne 1 ]]; then
            printf 'expected one complete-solution coverage report; found %s\n' \
              "${#coverage_reports[@]}" >&2
            exit 2
          fi
          python -B .github/scripts/collect_backend_coverage.py \
            --coverage-file "${coverage_reports[0]}" \
            --output "$results_directory/backend-coverage.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --results-directory "$results_directory" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload normalized backend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: .tmp/coverage/backend/${{ github.run_id }}/${{ github.run_attempt }}/backend-coverage.json
          if-no-files-found: ignore
          retention-days: 30

  coverage-gate:
    name: Coverage policy
    if: always()
    needs:
      - frontend-quality
      - backend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Download frontend coverage
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: .tmp/coverage

      - name: Download backend coverage
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: .tmp/coverage/backend

      - name: Enforce the coverage threshold for both modules
        if: always()
        shell: bash
        run: |
          set +e
          python -B .github/scripts/check_coverage.py \
            --frontend .tmp/coverage/frontend.json \
            --backend .tmp/coverage/backend/backend-coverage.json \
            --metric lines \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/coverage-summary.txt" 2>&1
          result=$?
          cat "$RUNNER_TEMP/coverage-summary.txt"
          exit "$result"

      - name: Upload coverage decision summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 30

  semgrep:
    name: Semgrep security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run both pinned Semgrep module policies
        id: semgrep-analysis
        env:
          SEMGREP_SUMMARY: ${{ runner.temp }}/semgrep-summary.json
        shell: bash
        run: |
          set +e
          docker run --rm --network none \
            --entrypoint python \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            .github/scripts/check_semgrep.py scan \
              --sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              > "$SEMGREP_SUMMARY"
          result=$?
          if [[ ! -s "$SEMGREP_SUMMARY" ]]; then
            printf '{"status":"incomplete","reason":"scanner_execution_failed"}\n' \
              > "$SEMGREP_SUMMARY"
            if [[ "$result" -eq 0 ]]; then result=2; fi
          fi
          cat "$SEMGREP_SUMMARY"
          exit "$result"

      - name: Upload sanitized Semgrep result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-summary
          path: ${{ runner.temp }}/semgrep-summary.json
          if-no-files-found: error
          retention-days: 7

  auth-e2e:
    name: Authentication E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_COMPOSE_PROJECT: lab-solos-quality-e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Install Chromium from the lockfile
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.0.0
        with:
          version: "29.7.2"
          set-host: true

      - name: Set up Docker Buildx
        id: e2e-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.0.0
        with:
          version: "v5.3.1"

      - name: Start synthetic E2E stack
        env:
          BUILDX_BUILDER: ${{ steps.e2e-builder.outputs.name }}
        run: docker compose -f docker-compose-e2e.yml up -d --build --wait

      - name: Run authentication E2E tests
        env:
          BUILDX_BUILDER: ${{ steps.e2e-builder.outputs.name }}
        working-directory: frontend
        run: npm run test:e2e -- --project=real --project=ui

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-e2e-artifacts
          path: frontend/e2e/infra/artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove synthetic E2E stack
        if: always()
        run: docker compose -f docker-compose-e2e.yml down --volumes --remove-orphans

  browser-security:
    name: Browser security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SECURITY_E2E_HTTPS_PORT: "18443"
      SECURITY_E2E_COMPOSE_PROJECT: lab-solos-ci-browser-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Install Chromium from the lockfile
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.0.0
        with:
          version: "29.7.2"
          set-host: true

      - name: Set up Docker Buildx
        id: e2e-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.0.0
        with:
          version: "v5.3.1"

      - name: Validate disposable security stack
        run: >-
          docker compose --project-name lab-solos-ci-browser-security
          --file docker-compose-security-e2e.yml config --quiet

      - name: Start disposable security stack
        env:
          BUILDX_BUILDER: ${{ steps.e2e-builder.outputs.name }}
        run: >-
          docker compose --project-name lab-solos-ci-browser-security
          --file docker-compose-security-e2e.yml up --detach --build --wait

      - name: Run browser security E2E and passive ZAP analysis
        env:
          BUILDX_BUILDER: ${{ steps.e2e-builder.outputs.name }}
        id: security-tests
        run: >-
          python -B .github/scripts/run_security_zap_e2e.py
          --compose-project lab-solos-ci-browser-security
          --report-root "${RUNNER_TEMP}/zap-passive"

      - name: Write sanitized result summary
        if: always()
        env:
          SECURITY_ANALYSIS_OUTCOME: ${{ steps.security-tests.outcome }}
          SECURITY_REPORT_ROOT: ${{ runner.temp }}/zap-passive
          SECURITY_SUMMARY_PATH: ${{ runner.temp }}/browser-security-summary.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_root = Path(os.environ["SECURITY_REPORT_ROOT"])
          report_files = sorted(report_root.glob("lab-solos-zap-passive-*.json"))
          policy = json.loads(Path(".github/quality/zap/passive-policy.json").read_text(encoding="utf-8"))
          summary = {
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_outcome": os.environ["SECURITY_ANALYSIS_OUTCOME"],
              "policy_version": policy["schema_version"],
              "status": "incomplete",
              "reason": "report_unavailable",
          }
          safe_message_fields = (
              "api_request_context", "api_routes", "body_unavailable",
              "body_unavailable_cache_skipped", "browser", "cache_evidence_ambiguous",
              "cache_skipped", "frontend_routes", "wire_304_ambiguous", "wire_304_responses",
          )
          if len(report_files) == 1:
              try:
                  report = json.loads(report_files[0].read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  summary["reason"] = "report_invalid"
              else:
                  if isinstance(report, dict) and report.get("schema_version") == 1:
                      summary["report"] = report_files[0].name
                      if report.get("status") in {"passed", "failed", "inconclusive"}:
                          summary["status"] = report["status"]
                      reason = report.get("reason")
                      if isinstance(reason, str):
                          summary["reason"] = reason
                      messages = report.get("messages")
                      if isinstance(messages, dict):
                          summary["messages"] = {
                              key: messages[key]
                              for key in safe_message_fields
                              if key in messages and type(messages[key]) is int and messages[key] >= 0
                          }
                      processing_seconds = report.get("processing_seconds")
                      if type(processing_seconds) in (int, float) and processing_seconds >= 0:
                          summary["processing_seconds"] = processing_seconds
                  else:
                      summary["reason"] = "report_invalid"
          summary_text = json.dumps(summary, ensure_ascii=False, sort_keys=True)
          Path(os.environ["SECURITY_SUMMARY_PATH"]).write_text(summary_text + "\n", encoding="utf-8")
          print(summary_text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("### Browser security and passive ZAP\n\n")
              output.write(f"- Status: `{summary['status']}`\n")
              output.write(f"- Run/attempt: `{summary['run_id']}/{summary['run_attempt']}`\n")
              output.write(f"- SHA: `{summary['sha']}`\n")
              output.write(f"- Policy version: `{summary['policy_version']}`\n")
              output.write(f"- Reason: `{summary['reason']}`\n")
          PY

      - name: Upload sanitized browser security artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-security-artifacts
          path: |
            ${{ runner.temp }}/browser-security-summary.json
            ${{ runner.temp }}/zap-passive/*.json
            frontend/e2e/infra/artifacts/report
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove disposable security stack
        if: always()
        run: >-
          docker compose --project-name lab-solos-ci-browser-security
          --file docker-compose-security-e2e.yml down --volumes --remove-orphans

  workflow-quality:
    name: Workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Set up Node.js for contract fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET for contract fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.428"

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Prepare temporary test workspace
        run: mkdir --parents .tmp

      - name: Run workflow contract tests
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Validate manual source
        run: python .github/scripts/check_manual.py --source docs/manual

      - name: Install actionlint 1.7.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install_actionlint.sh .tmp/actionlint

      - name: Lint container CI and release workflows
        run: .tmp/actionlint/actionlint .github/workflows/container-ci.yml .github/workflows/container-release.yml

  quality-baseline:
    name: Code quality baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.419
            8.0.428

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.0.0
        with:
          version: "29.7.2"
          set-host: true

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.0.0
        with:
          version: "v5.3.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Install quality dependencies from lockfile
        run: python -m pip install --requirement .github/quality/requirements.txt

      - name: Collect quality baseline
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python -B .github/scripts/quality_baseline.py collect --output .tmp/quality/current.json

      - name: Check quality baseline against trusted base
        id: quality-check
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python -B .github/scripts/quality_baseline.py check --current .tmp/quality/current.json --base-ref "$QUALITY_BASE_REF"

      - name: Render quality inventory
        if: always()
        run: python -B .github/scripts/quality_baseline.py render --current .tmp/quality/current.json --output .codex/docs/specs/fundacao-qualidade-testes/inventario.md

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-baseline-${{ github.run_id }}
          path: |
            .tmp/quality/**
            .codex/docs/specs/fundacao-qualidade-testes/inventario.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce quality check result
        if: always()
        run: test "${{ steps.quality-check.outcome }}" = "success"

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - frontend-quality
      - backend-quality
      - coverage-gate
      - semgrep
      - auth-e2e
      - browser-security
      - workflow-quality
      - quality-baseline
      - container-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Evaluate required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          E2E_RESULT: ${{ needs.auth-e2e.result }}
          BROWSER_SECURITY_RESULT: ${{ needs.browser-security.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-quality.result }}
          QUALITY_RESULT: ${{ needs.quality-baseline.result }}
          CONTAINER_RESULT: ${{ needs.container-scan.result }}
        run: >-
          python -B .github/scripts/check_quality_gate.py
          --required frontend-quality backend-quality coverage-gate semgrep auth-e2e browser-security workflow-quality
          quality-baseline container-scan
          --job "frontend-quality=$FRONTEND_RESULT"
          --job "backend-quality=$BACKEND_RESULT"
          --job "coverage-gate=$COVERAGE_RESULT"
          --job "semgrep=$SEMGREP_RESULT"
          --job "auth-e2e=$E2E_RESULT"
          --job "browser-security=$BROWSER_SECURITY_RESULT"
          --job "workflow-quality=$WORKFLOW_RESULT"
          --job "quality-baseline=$QUALITY_RESULT"
          --job "container-scan=$CONTAINER_RESULT"

  container-scan:
    name: Scan ${{ matrix.component }} on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local OCI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      - name: Extract OCI layout for Trivy 0.72.0
        shell: bash
        run: |
          mkdir --parents "${RUNNER_TEMP}/oci-layout"
          tar --extract --file "${RUNNER_TEMP}/image.tar" --directory "${RUNNER_TEMP}/oci-layout"

      - name: Install Trivy 0.72.0
        run: bash .github/scripts/install_trivy.sh .tmp/trivy

      - name: Generate Trivy table report
        shell: bash
        run: |
          .tmp/trivy/trivy image --config .trivy.yaml --exit-code 0 --format table \
            --output "${RUNNER_TEMP}/trivy-table.txt" --input "${RUNNER_TEMP}/oci-layout"
          cat "${RUNNER_TEMP}/trivy-table.txt"

      - name: Generate Trivy SARIF report
        run: >-
          .tmp/trivy/trivy image --config .trivy.yaml --exit-code 0 --format sarif
          --output "${RUNNER_TEMP}/trivy.sarif" --input "${RUNNER_TEMP}/oci-layout"

      - name: Upload Trivy reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.component }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: |
            ${{ runner.temp }}/trivy-table.txt
            ${{ runner.temp }}/trivy.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: container-${{ matrix.component }}-${{ matrix.platform }}

      - name: Enforce Trivy policy
        run: .tmp/trivy/trivy image --config .trivy.yaml --input "${RUNNER_TEMP}/oci-layout"
