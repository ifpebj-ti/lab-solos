name: Container CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".trivy.yaml"
      - ".github/scripts/**"
      - ".github/workflows/container-ci.yml"
      - ".github/workflows/container-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --run

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend solution
        run: dotnet restore backend/backend.sln

      - name: Build backend solution
        run: dotnet build backend/backend.sln --no-restore -c Release --nologo --disable-build-servers

      - name: Test backend solution
        run: dotnet test backend/backend.sln --no-build --no-restore -c Release --nologo --disable-build-servers

  workflow-quality:
    name: Workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run workflow contract tests
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Install actionlint 1.7.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install_actionlint.sh .tmp/actionlint

      - name: Lint container CI workflow
        run: .tmp/actionlint/actionlint .github/workflows/container-ci.yml

  container-scan:
    name: Scan ${{ matrix.component }} on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local OCI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      - name: Extract OCI layout for Trivy 0.72.0
        shell: bash
        run: |
          mkdir --parents "${RUNNER_TEMP}/oci-layout"
          tar --extract --file "${RUNNER_TEMP}/image.tar" --directory "${RUNNER_TEMP}/oci-layout"

      - name: Install Trivy 0.72.0
        run: bash .github/scripts/install_trivy.sh .tmp/trivy

      - name: Generate Trivy table report
        shell: bash
        run: |
          .tmp/trivy/trivy image --config .trivy.yaml --exit-code 0 --format table \
            --output "${RUNNER_TEMP}/trivy-table.txt" "${RUNNER_TEMP}/oci-layout"
          cat "${RUNNER_TEMP}/trivy-table.txt"

      - name: Generate Trivy SARIF report
        run: >-
          .tmp/trivy/trivy image --config .trivy.yaml --exit-code 0 --format sarif
          --output "${RUNNER_TEMP}/trivy.sarif" "${RUNNER_TEMP}/oci-layout"

      - name: Upload Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.component }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: |
            ${{ runner.temp }}/trivy-table.txt
            ${{ runner.temp }}/trivy.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: container-${{ matrix.component }}-${{ matrix.platform }}

      - name: Enforce Trivy policy
        run: .tmp/trivy/trivy image --config .trivy.yaml "${RUNNER_TEMP}/oci-layout"
