name: Container CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --run

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run design validator tests
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/tests -p 'test_check_design_coverage.py' -v

      - name: Validate design coverage inventory
        working-directory: ${{ github.workspace }}
        run: python scripts/check_design_coverage.py --spec .codex/docs/specs/reformulacao-design --final

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.419"

      - name: Restore backend solution
        run: dotnet restore backend/backend.sln

      - name: Build backend solution
        run: dotnet build backend/backend.sln --no-restore -c Release --nologo --disable-build-servers

      - name: Verify Docker for PostgreSQL integration tests
        run: docker info

      - name: Test PostgreSQL integration and credential migrations
        run: >-
          dotnet test backend/Tests/Tests.csproj --no-build --no-restore -c Release --nologo --disable-build-servers
          --filter "FullyQualifiedName~Integration|FullyQualifiedName~CredentialLifecycleMigrationTests"

      - name: Test backend solution
        run: dotnet test backend/backend.sln --no-build --no-restore -c Release --nologo --disable-build-servers

  auth-e2e:
    name: Authentication E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_COMPOSE_PROJECT: lab-solos-quality-e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Install Chromium from the lockfile
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.0.0
        with:
          version: "29.7.2"
          set-host: true

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.0.0
        with:
          version: "v5.3.1"

      - name: Start synthetic E2E stack
        run: docker compose -f docker-compose-e2e.yml up -d --build --wait

      - name: Run authentication E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-e2e-artifacts
          path: frontend/e2e/infra/artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove synthetic E2E stack
        if: always()
        run: docker compose -f docker-compose-e2e.yml down --volumes --remove-orphans

  workflow-quality:
    name: Workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Set up Node.js for contract fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET for contract fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.419"

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Prepare temporary test workspace
        run: mkdir --parents .tmp

      - name: Run workflow contract tests
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Validate manual source
        run: python .github/scripts/check_manual.py --source docs/manual

      - name: Install actionlint 1.7.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install_actionlint.sh .tmp/actionlint

      - name: Lint container CI workflow
        run: .tmp/actionlint/actionlint .github/workflows/container-ci.yml

  quality-baseline:
    name: Code quality baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.419"

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.0.0
        with:
          version: "29.7.2"
          set-host: true

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.0.0
        with:
          version: "v5.3.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci

      - name: Install quality dependencies from lockfile
        run: python -m pip install --requirement .github/quality/requirements.txt

      - name: Collect quality baseline
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python -B .github/scripts/quality_baseline.py collect --output .tmp/quality/current.json

      - name: Check quality baseline against trusted base
        id: quality-check
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python -B .github/scripts/quality_baseline.py check --current .tmp/quality/current.json --base-ref "$QUALITY_BASE_REF"

      - name: Render quality inventory
        if: always()
        run: python -B .github/scripts/quality_baseline.py render --current .tmp/quality/current.json --output .codex/docs/specs/fundacao-qualidade-testes/inventario.md

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-baseline-${{ github.run_id }}
          path: |
            .tmp/quality/**
            .codex/docs/specs/fundacao-qualidade-testes/inventario.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce quality check result
        if: always()
        run: test "${{ steps.quality-check.outcome }}" = "success"

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - frontend-quality
      - backend-quality
      - auth-e2e
      - workflow-quality
      - quality-baseline
      - container-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Evaluate required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          E2E_RESULT: ${{ needs.auth-e2e.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-quality.result }}
          QUALITY_RESULT: ${{ needs.quality-baseline.result }}
          CONTAINER_RESULT: ${{ needs.container-scan.result }}
        run: >-
          python -B .github/scripts/check_quality_gate.py
          --required frontend-quality backend-quality auth-e2e workflow-quality
          quality-baseline container-scan
          --job "frontend-quality=$FRONTEND_RESULT"
          --job "backend-quality=$BACKEND_RESULT"
          --job "auth-e2e=$E2E_RESULT"
          --job "workflow-quality=$WORKFLOW_RESULT"
          --job "quality-baseline=$QUALITY_RESULT"
          --job "container-scan=$CONTAINER_RESULT"

  container-scan:
    name: Scan ${{ matrix.component }} on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local OCI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      - name: Extract OCI layout for Trivy 0.72.0
        shell: bash
        run: |
          mkdir --parents "${RUNNER_TEMP}/oci-layout"
          tar --extract --file "${RUNNER_TEMP}/image.tar" --directory "${RUNNER_TEMP}/oci-layout"

      - name: Install Trivy 0.72.0
        run: bash .github/scripts/install_trivy.sh .tmp/trivy

      - name: Generate Trivy table report
        shell: bash
        run: |
          .tmp/trivy/trivy image --config .trivy.yaml --exit-code 0 --format table \
            --output "${RUNNER_TEMP}/trivy-table.txt" --input "${RUNNER_TEMP}/oci-layout"
          cat "${RUNNER_TEMP}/trivy-table.txt"

      - name: Generate Trivy SARIF report
        run: >-
          .tmp/trivy/trivy image --config .trivy.yaml --exit-code 0 --format sarif
          --output "${RUNNER_TEMP}/trivy.sarif" --input "${RUNNER_TEMP}/oci-layout"

      - name: Upload Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.component }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: |
            ${{ runner.temp }}/trivy-table.txt
            ${{ runner.temp }}/trivy.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: container-${{ matrix.component }}-${{ matrix.platform }}

      - name: Enforce Trivy policy
        run: .tmp/trivy/trivy image --config .trivy.yaml --input "${RUNNER_TEMP}/oci-layout"
