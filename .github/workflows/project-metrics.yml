name: Sincronizar GitHub Project

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, labeled, unlabeled, edited, synchronize]
  workflow_run:
    workflows:
      - Container CI
      - Container Release
      - Dependency security gate
      - Publicar PRDs na Wiki
      - CodeQL
    types: [completed]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  security-events: read

concurrency:
  group: sync-github-project
  cancel-in-progress: true

jobs:
  sync:
    name: Atualizar itens e métricas
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Verificar configuração
        id: config
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "${PROJECT_TOKEN}" ]; then
            echo "PROJECT_TOKEN ausente; pulando sincronização neste contexto."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PROJECT_OWNER}" ] || [ -z "${PROJECT_NUMBER}" ]; then
            echo "PROJECT_OWNER/PROJECT_NUMBER ausentes; pulando sincronização."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Obter versão confiável da automação
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false

      - name: Sincronizar Project
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .github/scripts/sync_github_project.py
