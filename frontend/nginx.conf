server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /login {
        try_files $uri /index.html;
    }

    location ~ ^/(?:change-password-required|forgot-your-password|reset-password|create-account)/?$ {
        try_files $uri /index.html;
    }

    location ~ ^/(?:boot|pre)/?$ {
        try_files $uri /index.html;
    }

    location ~ ^/admin(?:/(?:profile|insert|follow-up|users|search-material|products/[0-9]+/history|view-class|view-class-mentor|view-history-class-by-id|verification|history/(?:mentoring|loan)|register-request|all-loans|loans-request|return|settings|auditoria))?/?$ {
        try_files $uri /index.html;
    }

    location ~ ^/mentor(?:/(?:profile|my-class|verification|history/class|loan/creation|users-request|search-material|history/mentee|history/mentoring|history/loan|loan/histories|my-class/disabled))?/?$ {
        try_files $uri /index.html;
    }

    location ~ ^/mentee(?:/(?:search-material|profile|history/mentoring|history/loan|verification))?/?$ {
        try_files $uri /index.html;
    }

    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|map|png|svg|ttf|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Unknown URLs inside profile areas must reach React so its role-aware
    # catch-all can render Page404. The asset regex above keeps missing files
    # at 404 instead of returning the SPA document.
    location ~ ^/(?:admin|mentor|mentee)/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri =404;
    }
}
